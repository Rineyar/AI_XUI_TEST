[package]
name = "agent_core"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
include_dir = "0.7.4"
pyo3 = { version = "0.29.2", features = ["auto-initialize"] }
rig = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
serde-pyobject = "0.8.0"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "process"] }
tracing = { version = "0.1.44", features = ["async-await"] }
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

tools_rs = { path = "../tools/tools_rs" }

[lints.clippy]
needless_return = "allow"
needless_return_with_question_mark = "allow"
