services:
  agent:
    build:
      context: .
      dockerfile: dockerfile.txt

    image: agent-core:test
    container_name: agent-core

    env_file:
      - .env

    environment:
      LLM_BASE_URL: http://host.docker.internal:1234

    extra_hosts:
      - "host.docker.internal:host-gateway"

    stdin_open: true
    tty: true