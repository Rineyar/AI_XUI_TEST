services:
  sandbox: #Изолятор личный
    image: docker:29-dind-rootless
    privileged: true

    environment:
      DOCKER_TLS_CERTDIR: /certs
      DOCKER_TLS_SAN: DNS:sandbox

    volumes:
      - sandbox-certs:/certs/client
      - sandbox-data:/home/rootless/.local/share/docker
      - zap-plans-shared:/agent/workspace/zap_plans

    networks:
      - sandbox-control
      - sandbox-egress

    mem_limit: 4g
    cpus: 2
    pids_limit: 256

    healthcheck:
      test: ["CMD-SHELL", "docker -H unix:///run/user/1000/docker.sock info >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  agent: #Изолятор агента
    build:
      context: .
      dockerfile: dockerfile.txt

    image: agent-core:test
    container_name: agent-core

    env_file:
      - .env

    environment:
      DOCKER_HOST: tcp://sandbox:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client

    depends_on:
      sandbox:
        condition: service_healthy

    networks:
      - sandbox-control
      - llm-network

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./agent/logs:/agent/logs
      - sandbox-certs:/certs/client:ro  
    #  - ./agent/logs/selfanalysys.md:/agent/workspace/selfanalysys.md #РАскоменчивать на свой страх и риск. Удалять только на страх
      - ./agent/workspace:/agent/import:ro
      - zap-plans-shared:/agent/workspace/zap_plans

    # 30 секунд, чтобы всё за собой убрал
    stop_grace_period: 30s 
    stdin_open: true
    tty: true

volumes:
  sandbox-certs:
  sandbox-data:
  zap-plans-shared:

networks:
  sandbox-control:
    driver: bridge
    internal: true

  sandbox-egress:
    driver: bridge

  llm-network:
    driver: bridge
