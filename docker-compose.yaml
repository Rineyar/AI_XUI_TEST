services:
  agent:
    build:
      context: .
      dockerfile: dockerfile.txt

    image: agent-core:test
    container_name: agent-core

    env_file:
      - .env

    volumes:
      - type: bind
        source: ${PROJECTS_ROOT}
        target: /projects

    networks:
      - scan-network
      - llm-network

    extra_hosts:
      - "host.docker.internal:host-gateway"
      
    stdin_open: true
    tty: true

networks:
  scan-network:
    driver: bridge
    internal: true

  llm-network:
    driver: bridge