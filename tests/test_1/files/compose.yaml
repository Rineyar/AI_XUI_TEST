services:
  app:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      DATABASE_PATH: /data/apexfin.db
      DATABASE_MODE: ${DATABASE_MODE:-demo}
      SECRET_KEY: ${SECRET_KEY:-apexfin-local-demo-key}
    volumes:
      - database:/data
    restart: unless-stopped

volumes:
  database:
