name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust lint, audit, and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent/agent_core
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - run: cargo generate-lockfile

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent/agent_core -> target
          cache-version: rust-v1

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo audit --json > cargo-audit-report.json

      - name: Run Rust tests
        run: cargo test --all-targets --all-features
        env:
          DEEPSEEK_LOCAL_API_KEY: ${{ secrets.DEEPSEEK_LOCAL_API_KEY }}
          DARK_API_KEY: ${{ secrets.DARK_API_KEY }}

      - name: Upload Rust dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-report
          path: agent/agent_core/cargo-audit-report.json
          if-no-files-found: ignore

  python:
    name: Python lint, security, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-v1-${{ runner.os }}-3.13-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml', '**/setup.cfg') }}
          restore-keys: |
            pip-v1-${{ runner.os }}-3.13-

      - run: python -m pip install ruff==0.14.2 bandit==1.8.6 pytest==8.4.2 semgrep==1.139.0

      - run: ruff check agent
      - run: ruff format --check agent
      - run: bandit -r agent/tools agent/guardrails -ll -f json -o bandit-report.json
      - run: semgrep scan --config p/default --config p/security-audit --error --json --output semgrep-report.json agent/agent_core agent/tools agent/guardrails

      - name: Run Python tests
        run: pytest -q agent/tools agent/guardrails
        env:
          DEEPSEEK_LOCAL_API_KEY: ${{ secrets.DEEPSEEK_LOCAL_API_KEY }}
          DARK_API_KEY: ${{ secrets.DARK_API_KEY }}

      - name: Upload Python security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-security-reports
          path: |
            bandit-report.json
            semgrep-report.json
          if-no-files-found: ignore

  container:
    name: Build and scan container
    runs-on: ubuntu-latest
    needs: [rust, python]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: dockerfile.txt
          push: false
          load: true
          tags: ${{ steps.metadata.outputs.tags }}
          cache-from: type=gha,scope=agent-core-v1
          cache-to: type=gha,mode=max,scope=agent-core-v1

      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.metadata.outputs.tags }}
          format: json
          output: trivy-report.json
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Export scanned image
        run: docker save --output image.tar "$IMAGE"
        env:
          IMAGE: ${{ steps.metadata.outputs.tags }}

      - name: Save image tag
        run: printf '%s\n' "$IMAGE" > image-tag.txt
        env:
          IMAGE: ${{ steps.metadata.outputs.tags }}

      - name: Upload scanned image
        uses: actions/upload-artifact@v4
        with:
          name: scanned-image
          path: |
            image.tar
            image-tag.txt
          retention-days: 1

      - name: Upload container security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
          if-no-files-found: ignore

  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs: [container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: scanned-image

      - run: docker load --input image.tar

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish scanned image
        run: docker push "$(cat image-tag.txt)"
